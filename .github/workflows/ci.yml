name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  presets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [planner, efficiency]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Bundle patch valid
        working-directory: presets/${{ matrix.preset }}
        run: python scripts/validate.py

      - name: Behaviour tests (planner)
        if: matrix.preset == 'planner'
        working-directory: presets/planner
        run: node scripts/test-gate.mjs

      - name: Behaviour tests (efficiency)
        if: matrix.preset == 'efficiency'
        working-directory: presets/efficiency
        run: node scripts/test-guard.mjs
